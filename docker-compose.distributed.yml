# ==============================================================================
# OpenOptOut — Distributed Cluster Topology (Roadmap Phase 7.5)
#
# Production / High-Throughput Scaled Architecture:
#   - api: FastAPI Control Plane + Result Ingestion Service + APScheduler Producer
#   - redis: Unified High-Throughput Job Queue, Results Channel & Heartbeat Registry
#   - worker: Stateless Browser Worker Fleet (scale with `--scale worker=N`)
#   - web: Vite/React Frontend Dashboard
#   - db: PostgreSQL Database
#
# Usage:
#   docker compose -f docker-compose.distributed.yml up -d --scale worker=4
# ==============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: openoptout-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: ${REDIS_MEM_LIMIT:-768m}
          pids: ${REDIS_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    read_only: true
    ulimits:
      core: 0
    # requirepass: every container on this network can otherwise reach the
    # queue unauthenticated — including the worker fleet, which renders
    # untrusted external broker pages and is the highest-risk process here
    # (ASVS 13.2.1/13.2.2). No default: a deployment without REDIS_PASSWORD
    # set in .env refuses to start rather than running open.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    container_name: openoptout-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-2.0}"
          memory: ${DB_MEM_LIMIT:-1g}
          pids: ${DB_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=0755,uid=999,gid=999
    ulimits:
      core: 0
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openoptout}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-openoptout}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openoptout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: openoptout-api
    restart: unless-stopped
    # Plugin sandboxing: only this service runs the plugin manager (worker.py
    # never calls init_plugin_system()), so only it needs these. Full detail
    # in docker-compose.yml's "Plugin sandboxing" comment — short version:
    # REQUIRE_HARD_SANDBOX defaults to on, which needs bubblewrap able to
    # make user namespaces (cap_add: SYS_ADMIN) and the plugin's own seccomp
    # filter able to install (security_opt: seccomp:unconfined). Remove both
    # and set REQUIRE_HARD_SANDBOX=false to run with narrower privileges and
    # resource-limits-only plugin isolation instead.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: ${API_MEM_LIMIT:-2g}
          pids: ${API_PIDS_LIMIT:-2048}
    ulimits:
      core: 0
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - SETTINGS_FILE=/data/openoptout_settings.json
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openoptout}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-openoptout}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-}
    volumes:
      - app_data:/data
    # Read-only rootfs (CIS Docker Benchmark 5.13) — see docker-compose.yml's
    # api service for the full writable-path audit; same image, same answer.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/appuser:size=256m,uid=1000,gid=1000,mode=0700
      - /root:size=64m,mode=0700
      - /var/cache:size=128m
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8010}:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    # Unlike api, worker.py never calls init_plugin_system() — no bubblewrap
    # sandboxing here, so it doesn't need api's cap_add/seccomp:unconfined
    # exception and can run with the same no-new-privileges every other
    # service gets.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2.0}"
          memory: ${WORKER_MEM_LIMIT:-2g}
          pids: ${WORKER_PIDS_LIMIT:-2048}
    read_only: true
    ulimits:
      core: 0
    command: python -m worker
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - WORKER_DRY_RUN=${WORKER_DRY_RUN:-0}
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/appuser:size=256m,uid=1000,gid=1000,mode=0700
      - /root:size=64m,mode=0700
      - /var/cache:size=128m
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: openoptout-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-0.5}"
          memory: ${WEB_MEM_LIMIT:-128m}
          pids: ${WEB_PIDS_LIMIT:-128}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0755,uid=101,gid=101
      - /run:mode=0755,uid=101,gid=101
    ulimits:
      core: 0
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  app_data:
  redis_data:
  pg_data:
