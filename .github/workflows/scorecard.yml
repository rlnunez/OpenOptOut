# OpenSSF Scorecard — grades the repository's security practices (branch
# protection, pinned dependencies, code review, signed releases, ...) and lists
# concrete fixes in Security → Code scanning. Results are also published to
# https://scorecard.dev so the public badge in the README stays current.
#
# Scorecard requires its own workflow file with read-only defaults, so it is not
# part of security.yml.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"   # Mondays 06:43 UTC
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
