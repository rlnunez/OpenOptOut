# OpenSSF Scorecard — grades the repository's security practices (branch
# protection, pinned dependencies, code review, signed releases, ...) and lists
# concrete fixes in Security → Code scanning. Results are also published to
# https://scorecard.dev so the public badge in the README stays current.
#
# Scorecard requires its own workflow file with read-only defaults, so it is not
# part of security.yml.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 1"   # Mondays 06:43 UTC
  workflow_dispatch:
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish results to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
