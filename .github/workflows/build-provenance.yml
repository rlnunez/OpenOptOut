name: SLSA Level 3 Build Provenance & Container Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Required to push images and attestations to GHCR
      id-token: write       # Required for OIDC token generation (Cosign & GitHub Attestations)
      attestations: write   # Required for SLSA build provenance attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/${{ github.repository }}/backend

      - name: Build and push Docker image
        id: push-step
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SLSA Level 3 Build Provenance Attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.push-step.outputs.digest }}
          push-to-registry: true

      - name: Sign container image with Cosign (Keyless Sigstore)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: ${{ github.ref }}
          IMAGE_DIGEST: ${{ steps.push-step.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "repo=${IMAGE_REPO}" \
            -a "workflow=${WORKFLOW_NAME}" \
            -a "ref=${GIT_REF}" \
            "ghcr.io/${IMAGE_REPO}/backend@${IMAGE_DIGEST}"
