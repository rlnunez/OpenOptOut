name: SLSA Level 3 Build Provenance & Container Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Required to push images and attestations to GHCR
      id-token: write       # Required for OIDC token generation (Cosign & GitHub Attestations)
      attestations: write   # Required for SLSA build provenance attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/backend

      - name: Build and push Docker image
        id: push-step
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SLSA Level 3 Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ github.event_name != 'pull_request' }}
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.push-step.outputs.digest }}
          push-to-registry: true

      - name: Sign container image with Cosign (Keyless Sigstore)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: ${{ github.ref }}
          IMAGE_DIGEST: ${{ steps.push-step.outputs.digest }}
        run: |
          cosign sign --yes \
            -a "repo=${IMAGE_REPO}" \
            -a "workflow=${WORKFLOW_NAME}" \
            -a "ref=${GIT_REF}" \
            "ghcr.io/${IMAGE_REPO}/backend@${IMAGE_DIGEST}"
