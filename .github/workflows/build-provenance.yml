name: SLSA Level 3 Build Provenance & Container Signing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag version to build, attest, and sign (e.g., v0.11.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Build, Attest & Sign Release
    runs-on: ubuntu-latest
    if: github.actor == 'rlnunez' || github.actor == github.repository_owner
    permissions:
      contents: read
      packages: write       # Required to push images and attestations to GHCR
      id-token: write       # Required for OIDC token generation (Cosign & GitHub Attestations)
      attestations: write   # Required for SLSA build provenance attestations
    steps:
      - name: Verify authorization
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "rlnunez" ] && [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Unauthorized user '$ACTOR'. Only repository owner '$OWNER' can trigger release signing."
            exit 1
          fi

      - name: Validate tag input
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "::error::Invalid tag format '$TAG'. Expected format 'vX.Y.Z' (e.g., v0.11.4)."
            exit 1
          fi

      - name: Checkout repository at tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push-step
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SLSA Level 3 Build Provenance Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.push-step.outputs.digest }}
          push-to-registry: true

      - name: Sign container image with Cosign (Keyless Sigstore)
        env:
          IMAGE_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: refs/tags/${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.push-step.outputs.digest }}
        run: |
          IMAGE_REPO_LOWER=$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes \
            -a "repo=${IMAGE_REPO}" \
            -a "workflow=${WORKFLOW_NAME}" \
            -a "ref=${GIT_REF}" \
            "ghcr.io/${IMAGE_REPO_LOWER}/backend@${IMAGE_DIGEST}"
