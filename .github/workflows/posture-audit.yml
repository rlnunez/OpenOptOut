# ==============================================================================
# OpenOptOut — Security Hardening & Posture Audit Workflow
#
# Runs testing probes for:
#   1. Ephemeral RAM tmpfs (/tmp) sizing & leak tests (Roadmap Phase 15.2)
#   2. Container no-new-privileges bubblewrap sandbox compatibility (Roadmap Phase 21.2)
#
# Run manually on-demand via workflow_dispatch ("Run workflow" in Actions).
# ==============================================================================

name: Security Posture Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Environment to audit: 'all' (native + docker), 'docker', or 'native'"
        type: choice
        options:
          - all
          - docker
          - native
        default: all
      concurrency:
        description: "Concurrent workers for tmpfs allocation stress"
        type: number
        default: 4
      payload_mb:
        description: "Payload size per worker in MB"
        type: number
        default: 25

permissions:
  contents: read

concurrency:
  group: posture-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Posture Audit (${{ inputs.mode || 'all' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Bubblewrap on runner host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap libseccomp2
          # ubuntu-24.04 runners restrict unprivileged user namespaces through
          # AppArmor, so bwrap fails with "setting up uid map: Permission
          # denied". Lift it on this throwaway runner, as an operator would on
          # an Ubuntu 23.10+ host that runs plugins (see test_no_new_privs.py).
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Start Docker API container
        if: ${{ (inputs.mode || 'all') != 'native' }}
        run: |
          SECRET_KEY="$(openssl rand -hex 32)"
          export SECRET_KEY
          echo "SECRET_KEY=$SECRET_KEY" >> "$GITHUB_ENV"
          docker compose build api
          docker compose up -d api
          # Wait up to 30s for the container to become ready
          attempt=1
          while [ "$attempt" -le 30 ]; do
            if docker compose exec -T api python3 -c "import sys; sys.exit(0)" >/dev/null 2>&1; then
              echo "API container ready after ${attempt}s."
              break
            fi
            sleep 1
            attempt=$((attempt + 1))
          done

      - name: Execute Security Posture Audit
        id: run_audit
        env:
          AUDIT_MODE: ${{ inputs.mode || 'all' }}
          AUDIT_CONCURRENCY: ${{ inputs.concurrency || 4 }}
          AUDIT_PAYLOAD_MB: ${{ inputs.payload_mb || 25 }}
          NO_COLOR: "1"
        run: |
          set -o pipefail
          mkdir -p reports
          mode="$AUDIT_MODE"
          status=0

          # Each audit runs even if the other one fails, so the summary
          # always shows both results.
          if [ "$mode" != "docker" ]; then
            echo "Running Native Host Audit..."
            bash scripts/test-hardening-posture.sh --native 2>&1 | tee reports/host-audit.txt || status=1
            echo
          fi
          if [ "$mode" != "native" ]; then
            echo "Running Docker Container Audit..."
            bash scripts/test-hardening-posture.sh --docker 2>&1 | tee reports/docker-audit.txt || status=1
          fi
          exit "$status"

      - name: Generate Summary Report
        if: always()
        run: |
          {
            echo "## 🛡️ Security Posture Audit Summary"
            echo
            if [ -f reports/host-audit.txt ]; then
              echo "### 🖥️ Native Host Runner Posture"
              echo '```text'
              cat reports/host-audit.txt
              echo '```'
              echo
            fi
            if [ -f reports/docker-audit.txt ]; then
              echo "### 🐳 Docker API Container Posture"
              echo '```text'
              cat reports/docker-audit.txt
              echo '```'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Audit Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posture-audit-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: |
          docker compose down -v || true

