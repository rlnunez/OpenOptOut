  <!-- Card 1: User Request -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect width="240" height="380" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="24" width="40" height="40" rx="10" fill="#38bdf8" fill-opacity="0.15" />
    <text x="32" y="50" font-family="monospace" font-size="20" fill="#38bdf8">&gt;_</text>
    <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">STAGE 1</text>
    <text x="75" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">User Request</text>
    
    <rect x="20" y="85" width="200" height="110" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="32" y="112" font-family="monospace" font-size="12" fill="#94a3b8">"Write an opt-out</text>
    <text x="32" y="132" font-family="monospace" font-size="12" fill="#94a3b8">plugin for broker</text>
    <text x="32" y="152" font-family="monospace" font-size="12" fill="#38bdf8">FastPeopleSearch</text>
    <text x="32" y="172" font-family="monospace" font-size="12" fill="#94a3b8">from their form"</text>

    <text x="20" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Triggers:</text>
    <text x="20" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">• Form inspection</text>
    <text x="20" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">• Policy analysis</text>
    <text x="20" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">• Target discovery</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 315 350 L 345 350" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" stroke-linecap="round"/>

