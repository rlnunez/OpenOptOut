    <text x="32" y="218" font-family="monospace" font-size="11" fill="#38bdf8">}</text>

    <text x="20" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Bundle Files:</text>
    <text x="20" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">📄 manifest.json</text>
    <text x="20" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">⚙️ spec.json (Closed Vocab)</text>
    <text x="20" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">📖 README.md</text>
