    <rect x="20" y="24" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.15" />
    <text x="30" y="50" font-family="sans-serif" font-size="20" fill="#10b981">🛡️</text>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">STAGE 4</text>
    <text x="70" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Verification</text>

