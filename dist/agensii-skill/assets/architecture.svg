    <text x="44" y="146" font-family="monospace" font-size="11" fill="#cbd5e1">"field": <tspan fill="#fbbf24">"contact_email"</tspan></text>
    <text x="32" y="164" font-family="monospace" font-size="11" fill="#38bdf8">}, {</text>
