      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ CLI Validator</text>
      <text x="12" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">validate.py passing</text>

      <rect y="75" width="138" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Rehearsal</text>
      <text x="12" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Zero-PII synthetic</text>

      <rect y="150" width="138" height="60" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981">✓ Sandboxed</text>
      <text x="12" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Seccomp / bubblewrap</text>
    </g>
