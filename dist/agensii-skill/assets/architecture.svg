    </text>
    <rect x="780" y="14" width="300" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="800" cy="32" r="6" fill="#10b981"/>
    <text x="816" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      COPPA • GDPR • ASVS Compliant
