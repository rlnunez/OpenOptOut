# Use the scheme Caddy saw (https) when behind the HTTPS front door.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# nginx itself only ever listens on plain HTTP here (Caddy, when present,
# terminates TLS and forwards); an empty map value makes add_header skip the
# header entirely, so HSTS only goes out once X-Forwarded-Proto says the
# browser actually got this response over HTTPS (ASVS 3.4.1).
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Security defense-in-depth headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # ASVS 3.4.8/3.5.8: block window.opener-based tabnabbing and cross-origin
    # resource embedding of this origin's own responses.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # ASVS 3.4.3: base-uri 'none' (no <base> tag is used, so nothing relies on
    # it); 3.4.7: violations are reported to the API instead of going nowhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; report-uri /api/csp-report; report-to csp-endpoint;" always;
    add_header Reporting-Endpoints 'csp-endpoint="/api/csp-report"' always;
    add_header Strict-Transport-Security $hsts_header always;

    # Proxy API calls to FastAPI. ^~ : always wins over the regex location
    # below for this prefix, regardless of the requested path's extension.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        # Behind the optional Caddy HTTPS front door, keep the original scheme
        # and client chain (Caddy sets these; direct HTTP requests fall back).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ASVS 14.2.5: a request for something that LOOKS like a static asset
    # (has a file extension) but doesn't exist gets a real 404, not the SPA
    # shell with a 200 — a cache sitting in front of this app (or a shared
    # proxy) must never be able to store index.html under an asset URL it
    # was never meant to be served as (Web Cache Deception).
    location ~ "\.[a-zA-Z0-9]{1,6}$" {
        try_files $uri =404;
    }

    # SPA fallback — extensionless routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
