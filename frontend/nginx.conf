# Use the scheme Caddy saw (https) when behind the HTTPS front door.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Security defense-in-depth headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy API calls to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;  # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        # Behind the optional Caddy HTTPS front door, keep the original scheme
        # and client chain (Caddy sets these; direct HTTP requests fall back).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
