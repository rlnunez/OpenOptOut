# Use the scheme Caddy saw (https) when behind the HTTPS front door.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used -- standard reverse proxy header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Behind the optional Caddy HTTPS front door, keep the original scheme
        # and client chain (Caddy sets these; direct HTTP requests fall back).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
